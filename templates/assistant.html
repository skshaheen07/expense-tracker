<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Financial Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#0f172a;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.container{

width:90%;
height:90vh;

background:#111827;

border-radius:20px;

overflow:hidden;

display:flex;

box-shadow:0 15px 40px rgba(0,0,0,.4);

}

.sidebar{

width:300px;

background:linear-gradient(180deg,#2563eb,#1e40af);

padding:30px;

color:white;

}

.avatar{

text-align:center;

}

.avatar img{

width:90px;

border-radius:50%;

margin-bottom:10px;

}

.status{

color:#22c55e;
font-size:14px;

}

.summary{

margin-top:30px;

}

.card{

background:rgba(255,255,255,.15);

padding:15px;

border-radius:12px;

margin-bottom:15px;

}

.chat{

flex:1;

display:flex;

flex-direction:column;

background:#f8fafc;

}

.header{

padding:20px;

background:white;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.messages{

flex:1;

overflow-y:auto;

padding:25px;

}

.user{

background:#2563eb;

color:white;

padding:15px;

border-radius:15px 15px 0 15px;

max-width:70%;

margin-left:auto;

margin-bottom:15px;

}

.ai{

background:white;

padding:15px;

border-radius:15px 15px 15px 0;

max-width:70%;

margin-bottom:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.quick{

padding:15px;

display:flex;

gap:10px;

flex-wrap:wrap;

}

.quick button{

padding:10px 15px;

border:none;

border-radius:25px;

background:#dbeafe;

cursor:pointer;

}

.input{

display:flex;

padding:20px;

background:white;

}

.input input{

flex:1;

padding:15px;

border-radius:30px;

border:1px solid #ccc;

outline:none;

}

.input button{

margin-left:10px;

width:60px;

border:none;

border-radius:50%;

background:#2563eb;

color:white;

font-size:20px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<div class="avatar">

<img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png">

<h2>Finance AI</h2>

<div class="status">
● Online
</div>

</div>

<div class="summary">

<div class="card">

<h4>Total Income</h4>

<p id="income">₹0</p>

</div>

<div class="card">

<h4>Total Expense</h4>

<p id="expense">₹0</p>

</div>

<div class="card">

<h4>Savings</h4>

<p id="saving">₹0</p>

</div>

</div>

</div>

<div class="chat">

<div class="header">

<h2>AI Financial Assistant</h2>

<i class="fa-solid fa-robot fa-2x"></i>

</div>

<div id="messages" class="messages">

<div class="ai">

👋 Hello! I'm your AI Financial Advisor.

Ask me anything about your expenses, savings, or budgeting.

</div>

</div>

<div class="quick">

<button onclick="ask('How can I save more money?')">Save Money</button>

<button onclick="ask('Analyze my expenses')">Analyze</button>

<button onclick="ask('Give budgeting tips')">Budget</button>

<button onclick="ask('Where am I overspending?')">Overspending</button>

</div>

<div class="input">

<input id="question"
placeholder="Ask your financial question...">

<button onclick="send()">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

</div>

<script>

function ask(text){

document.getElementById("question").value=text;

send();

}

function send(){

let q=document.getElementById("question").value;

if(q=="") return;

let msg=document.getElementById("messages");

msg.innerHTML+=`<div class="user">${q}</div>`;

axios.post("/ask-ai",{

question:q

})

.then(res=>{

msg.innerHTML+=`<div class="ai">${res.data.recommendation}</div>`;

document.getElementById("income").innerHTML="₹"+res.data.income;

document.getElementById("expense").innerHTML="₹"+res.data.expense;

document.getElementById("saving").innerHTML="₹"+res.data.savings;

msg.scrollTop=msg.scrollHeight;

});

document.getElementById("question").value="";

}

</script>

</body>

</html>
