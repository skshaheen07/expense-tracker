<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>Edit Transaction</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Title</label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ transaction.title }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Category</label>

                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        value="{{ transaction.category }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Amount</label>

                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        value="{{ transaction.amount }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Notes</label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="4">{{ transaction.notes }}</textarea>

                </div>

                <button
                    class="btn btn-success">

                    Update Transaction

                </button>

                <a href="{{ url_for('transactions') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
